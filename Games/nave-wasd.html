<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nave Espacial — Info Kid</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1628;--orange:#ff8c42;--yellow:#ffd84d;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--navy);font-family:'Nunito',sans-serif;color:#f0f4ff;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.07);}
  .back{text-decoration:none;color:var(--orange);font-weight:800;}
  .htitle{font-family:'Fredoka One';font-size:1.3rem;color:var(--orange);}
  canvas{border-radius:12px;border:2px solid rgba(255,140,66,0.25);margin:12px 0;display:block;}
  .keys-guide{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .key{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-bottom:3px solid rgba(255,255,255,0.3);border-radius:8px;padding:5px 12px;font-size:0.8rem;font-weight:800;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;
    background:rgba(10,22,40,0.9);border-radius:12px;text-align:center;padding:24px;}
  #overlay h2{font-family:'Fredoka One';font-size:2rem;color:var(--orange);}
  .score-big{font-family:'Fredoka One';font-size:3rem;color:var(--yellow);}
  .btn{background:var(--orange);color:white;font-family:'Fredoka One';font-size:1.1rem;
    border:none;padding:12px 32px;border-radius:40px;cursor:pointer;}
  .wrap{position:relative;}
  .mobile-ctrl{display:none;gap:6px;flex-direction:column;align-items:center;margin:8px 0;}
  .ctrl-row{display:flex;gap:6px;}
  .mbtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;width:52px;height:52px;font-size:1.4rem;cursor:pointer;
    color:white;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;}
  .mbtn:active{background:rgba(255,140,66,0.4);}
  @media(max-width:500px){.mobile-ctrl{display:flex;}}
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Voltar</a>
  <span class="htitle">🚀 Nave Espacial</span>
  <div style="font-weight:800">Distância: <span id="score-disp" style="color:var(--yellow)">0</span></div>
</header>

<div class="wrap">
  <canvas id="c" width="500" height="380"></canvas>
  <div id="overlay">
    <h2>🚀 Nave Espacial</h2>
    <p style="color:rgba(240,244,255,0.7)">Use <strong>W A S D</strong> ou <strong>← ↑ → ↓</strong> para pilotar.<br>
    Desvie dos meteoros e sobreviva o máximo possível!</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0;">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span style="opacity:0.5;font-size:0.8rem;align-self:center">ou</span>
      <span class="key">← ↑ → ↓</span>
    </div>
    <button class="btn" onclick="startGame()">Decolar!</button>
  </div>
</div>

<div class="keys-guide">
  <span class="key">W / ↑</span><span class="key">A / ←</span>
  <span class="key">S / ↓</span><span class="key">D / →</span>
</div>
<div class="mobile-ctrl">
  <div class="ctrl-row"><button class="mbtn" id="mw">▲</button></div>
  <div class="ctrl-row">
    <button class="mbtn" id="ma">◀</button>
    <button class="mbtn" id="ms">▼</button>
    <button class="mbtn" id="md">▶</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=500,H=380;
const keys={};
let ship,meteors,stars_bg,score,raf,alive,particles=[],frame=0;

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].forEach(k=>{
    if(e.code===k) e.preventDefault();
  });
});
document.addEventListener('keyup',e=>keys[e.code]=false);

['mw','ma','ms','md'].forEach((id,i)=>{
  const codes=['KeyW','KeyA','KeyS','KeyD'];
  const btn=document.getElementById(id);
  if(!btn)return;
  btn.addEventListener('touchstart',e=>{keys[codes[i]]=true;e.preventDefault();},{passive:false});
  btn.addEventListener('touchend',e=>{keys[codes[i]]=false;e.preventDefault();},{passive:false});
  btn.addEventListener('mousedown',()=>keys[codes[i]]=true);
  btn.addEventListener('mouseup',()=>keys[codes[i]]=false);
});

function isLeft(){ return keys['KeyA']||keys['ArrowLeft']; }
function isRight(){ return keys['KeyD']||keys['ArrowRight']; }
function isUp(){ return keys['KeyW']||keys['ArrowUp']; }
function isDown(){ return keys['KeyS']||keys['ArrowDown']; }

function spawnMeteor(){
  const size=15+Math.random()*30;
  return {
    x:W+size,
    y:Math.random()*H,
    vx:-(2+Math.random()*3+score*0.002),
    vy:(Math.random()-0.5)*2,
    r:size, rot:0, rotV:(Math.random()-0.5)*0.06,
    color:`hsl(${20+Math.random()*20},${40+Math.random()*30}%,${35+Math.random()*15}%)`
  };
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  ship={x:100,y:H/2,vx:0,vy:0,r:18,tilt:0,trail:[]};
  meteors=[];
  stars_bg=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5,sp:0.5+Math.random()*2}));
  score=0; alive=true; particles=[];
  if(raf) cancelAnimationFrame(raf);
  loop();
}

function loop(){
  frame++;
  update();
  draw();
  if(alive) raf=requestAnimationFrame(loop);
}

function update(){
  const acc=0.35, drag=0.88, maxSpd=4.5;
  if(isLeft())  ship.vx-=acc;
  if(isRight()) ship.vx+=acc;
  if(isUp())    ship.vy-=acc;
  if(isDown())  ship.vy+=acc;
  ship.vx*=drag; ship.vy*=drag;
  ship.vx=Math.max(-maxSpd,Math.min(maxSpd,ship.vx));
  ship.vy=Math.max(-maxSpd,Math.min(maxSpd,ship.vy));

  ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x+ship.vx));
  ship.y=Math.max(ship.r,Math.min(H-ship.r,ship.y+ship.vy));
  ship.tilt = ship.vy*0.12;

  // Trail
  ship.trail.push({x:ship.x,y:ship.y,life:18});
  ship.trail=ship.trail.filter(t=>{ t.life--; return t.life>0; });

  // Spawn meteors
  if(frame%Math.max(25,80-Math.floor(score/50))===0) meteors.push(spawnMeteor());

  meteors.forEach(m=>{ m.x+=m.vx; m.y+=m.vy; m.rot+=m.rotV;
    if(m.y<m.r||m.y>H-m.r) m.vy*=-1;
  });
  meteors=meteors.filter(m=>m.x>-100);

  // BG stars scroll
  stars_bg.forEach(s=>{ s.x-=s.sp; if(s.x<0){ s.x=W; s.y=Math.random()*H; } });

  // Score
  if(frame%60===0){ score++; document.getElementById('score-disp').textContent=score; }

  // Collision
  meteors.forEach(m=>{
    const dx=ship.x-m.x, dy=ship.y-m.y;
    if(dx*dx+dy*dy<(ship.r+m.r-6)*(ship.r+m.r-6)){
      alive=false;
      for(let i=0;i<20;i++){
        const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
        particles.push({x:ship.x,y:ship.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,color:i%2===0?'#ff8c42':'#ffd84d',life:40});
      }
      setTimeout(gameOver,800);
    }
  });
  particles=particles.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;return p.life>0; });
}

function draw(){
  // Space bg
  ctx.fillStyle='#04101f';
  ctx.fillRect(0,0,W,H);

  // Stars
  stars_bg.forEach(s=>{
    ctx.globalAlpha=0.4+s.r*0.2;
    ctx.fillStyle='white';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // Meteors
  meteors.forEach(m=>{
    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(m.rot);
    ctx.fillStyle=m.color;
    ctx.beginPath();
    const pts=6+Math.floor(m.r/10);
    for(let i=0;i<pts;i++){
      const a=i/pts*Math.PI*2;
      const r2=m.r*(0.75+Math.sin(i*2.3)*0.25);
      i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  });

  // Ship trail
  ship.trail.forEach((t,i)=>{
    ctx.globalAlpha=t.life/18*0.4;
    ctx.fillStyle='#3b9eff';
    ctx.beginPath(); ctx.arc(t.x,t.y,4*(i/ship.trail.length),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // Exhaust flame
  ctx.save();
  ctx.translate(ship.x,ship.y);
  ctx.rotate(ship.tilt);
  const fl=6+Math.sin(frame*0.3)*4;
  ctx.fillStyle='rgba(255,140,66,0.7)';
  ctx.beginPath();
  ctx.moveTo(-ship.r+2, -5);
  ctx.lineTo(-ship.r-fl, 0);
  ctx.lineTo(-ship.r+2, 5);
  ctx.fill();

  // Ship body
  ctx.fillStyle='#3b9eff';
  ctx.beginPath();
  ctx.moveTo(ship.r, 0);
  ctx.lineTo(-ship.r*0.6, -ship.r*0.55);
  ctx.lineTo(-ship.r*0.8, 0);
  ctx.lineTo(-ship.r*0.6, ship.r*0.55);
  ctx.closePath(); ctx.fill();

  // Cockpit
  ctx.fillStyle='#a0d8ff';
  ctx.beginPath();
  ctx.ellipse(4,0,9,7,0,0,Math.PI*2);
  ctx.fill();

  // Engine pods
  ctx.fillStyle='#1a6fbb';
  ctx.fillRect(-ship.r*0.8,-ship.r*0.55,16,8);
  ctx.fillRect(-ship.r*0.8,ship.r*0.55-8,16,8);
  ctx.restore();

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/40;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(8,8,140,28,8); ctx.fill();
  ctx.fillStyle='#ffd84d';
  ctx.font='bold 13px Nunito';
  ctx.fillText(`🚀 ${score} km percorridos`, 18,27);
}

function gameOver(){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<h2>💥 Colisão!</h2>
    <div class="score-big">${score}</div>
    <p style="color:rgba(240,244,255,0.7)">km percorridos! Pilote melhor da próxima vez!</p>
    <button class="btn" onclick="startGame()">Tentar de Novo</button>
    <a href="../index.html" class="btn" style="background:rgba(255,255,255,0.1);color:#f0f4ff;text-decoration:none;margin-top:4px">← Voltar</a>`;
  ov.style.display='flex';
}
</script>
</body>
</html>
