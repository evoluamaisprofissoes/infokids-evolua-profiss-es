<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxy Jump! — Info Kid</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1628;--green:#00c896;--yellow:#ffd84d;--pink:#ff6b9d;--white:#f0f4ff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--navy);font-family:'Nunito',sans-serif;color:var(--white);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.07);}
  .back{text-decoration:none;color:var(--green);font-weight:800;font-size:0.9rem;}
  .htitle{font-family:'Fredoka One';font-size:1.3rem;background:linear-gradient(90deg,var(--pink),var(--yellow));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .hud{display:flex;gap:20px;font-size:0.85rem;font-weight:800;}
  .hud span{color:var(--yellow);}

  #wrap{position:relative;width:100%;max-width:800px;margin-top:8px;}
  canvas{display:block;width:100%;border-radius:16px;border:1px solid rgba(255,255,255,0.08);
    image-rendering:pixelated;}

  .keys-guide{display:flex;gap:10px;justify-content:center;align-items:center;
    margin:10px 0;flex-wrap:wrap;}
  .key{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-bottom:3px solid rgba(255,255,255,0.3);border-radius:8px;
    padding:5px 12px;font-size:0.8rem;font-weight:800;color:rgba(240,244,255,0.8);}

  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border-radius:16px;
    background:rgba(10,22,40,0.88);gap:12px;text-align:center;padding:24px;}
  #overlay h2{font-family:'Fredoka One';font-size:2rem;color:var(--pink);}
  #overlay p{color:rgba(240,244,255,0.7);font-size:0.95rem;max-width:320px;}
  #overlay .score-big{font-family:'Fredoka One';font-size:3rem;color:var(--yellow);}
  .btn{background:var(--green);color:var(--navy);font-family:'Fredoka One';
    font-size:1.1rem;border:none;padding:12px 32px;border-radius:40px;
    cursor:pointer;transition:transform 0.15s;}
  .btn:hover{transform:scale(1.06);}

  /* mobile controls */
  .mobile-ctrl{display:none;gap:8px;margin:8px 0;}
  .mbtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;width:52px;height:52px;font-size:1.4rem;cursor:pointer;
    color:white;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .mbtn:active{background:rgba(255,255,255,0.25);}
  @media(max-width:600px){.mobile-ctrl{display:flex;}}
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Voltar</a>
  <span class="htitle">🦊 Foxy Jump!</span>
  <div class="hud">Pontos: <span id="score">0</span> &nbsp; Vidas: <span id="lives">3</span></div>
</header>

<div id="wrap">
  <canvas id="c" width="800" height="400"></canvas>
  <div id="overlay">
    <h2>🦊 Foxy Jump!</h2>
    <p>Mova a raposa com <strong>← →</strong> e pule com <strong>ESPAÇO</strong>.<br>
    Colete moedas, desvie dos inimigos e chegue à bandeira!</p>
    <button class="btn" onclick="startGame()">Jogar!</button>
  </div>
</div>

<div class="keys-guide">
  <span class="key">← Esquerda</span>
  <span class="key">→ Direita</span>
  <span class="key">ESPAÇO Pular</span>
</div>

<div class="mobile-ctrl">
  <button class="mbtn" id="mb-left">◀</button>
  <button class="mbtn" id="mb-jump">⬆</button>
  <button class="mbtn" id="mb-right">▶</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 400;

let game, raf;
const keys = {};

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile buttons
['mb-left','mb-right','mb-jump'].forEach(id => {
  const btn = document.getElementById(id);
  const code = id==='mb-left'?'ArrowLeft':id==='mb-right'?'ArrowRight':'Space';
  btn.addEventListener('touchstart', e=>{ keys[code]=true; e.preventDefault(); }, {passive:false});
  btn.addEventListener('touchend', e=>{ keys[code]=false; e.preventDefault(); }, {passive:false});
  btn.addEventListener('mousedown', ()=> keys[code]=true);
  btn.addEventListener('mouseup', ()=> keys[code]=false);
});

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  game = {
    score: 0, lives: 3, dead: false, won: false,
    cam: 0,
    fox: { x:100, y:200, w:36, h:36, vx:0, vy:0, onGround:false, facing:1, frame:0, frameT:0 },
    platforms: buildPlatforms(),
    coins: buildCoins(),
    enemies: buildEnemies(),
    flag: { x: 2600, y: 120 },
    particles: []
  };
  updateHUD();
  if(raf) cancelAnimationFrame(raf);
  loop();
}

function buildPlatforms(){
  const p = [
    // Ground segments
    {x:0,   y:340, w:400, h:60, color:'#1a5c2a'},
    {x:450, y:340, w:300, h:60, color:'#1a5c2a'},
    {x:800, y:340, w:250, h:60, color:'#1a5c2a'},
    {x:1100,y:340, w:400, h:60, color:'#1a5c2a'},
    {x:1560,y:340, w:300, h:60, color:'#1a5c2a'},
    {x:1910,y:340, w:200, h:60, color:'#1a5c2a'},
    {x:2160,y:340, w:500, h:60, color:'#1a5c2a'},
    // Elevated
    {x:200, y:260, w:120, h:16, color:'#2d7a3a'},
    {x:500, y:220, w:100, h:16, color:'#2d7a3a'},
    {x:680, y:260, w:140, h:16, color:'#2d7a3a'},
    {x:900, y:240, w:120, h:16, color:'#2d7a3a'},
    {x:1060,y:200, w:100, h:16, color:'#2d7a3a'},
    {x:1200,y:260, w:140, h:16, color:'#2d7a3a'},
    {x:1380,y:220, w:100, h:16, color:'#2d7a3a'},
    {x:1650,y:230, w:120, h:16, color:'#2d7a3a'},
    {x:1820,y:180, w:80,  h:16, color:'#2d7a3a'},
    {x:2000,y:260, w:120, h:16, color:'#2d7a3a'},
    {x:2200,y:200, w:100, h:16, color:'#2d7a3a'},
    {x:2380,y:240, w:120, h:16, color:'#2d7a3a'},
    {x:2500,y:180, w:80,  h:16, color:'#2d7a3a'},
  ];
  return p;
}
function buildCoins(){
  const positions = [
    220,260, 260,260, 520,200, 700,240, 920,220,
    1080,180, 1220,240, 1400,200, 1660,210, 1840,160,
    470,310, 820,310, 1560,310, 2020,240, 2210,180,
    2400,220, 2520,160, 580,310, 950,310, 1300,310
  ];
  const coins = [];
  for(let i=0;i<positions.length;i+=2)
    coins.push({x:positions[i],y:positions[i+1],r:9,collected:false,anim:Math.random()*Math.PI*2});
  return coins;
}
function buildEnemies(){
  return [
    {x:350,y:304,w:32,h:36,vx:-1.2,dir:-1,minX:200,maxX:400,alive:true},
    {x:700,y:304,w:32,h:36,vx:1.0, dir:1, minX:600,maxX:750,alive:true},
    {x:950,y:304,w:32,h:36,vx:-1.5,dir:-1,minX:800,maxX:1000,alive:true},
    {x:1200,y:304,w:32,h:36,vx:1.2,dir:1, minX:1100,maxX:1350,alive:true},
    {x:1700,y:304,w:32,h:36,vx:-1.0,dir:-1,minX:1580,maxX:1780,alive:true},
    {x:2050,y:304,w:32,h:36,vx:1.3,dir:1, minX:1950,maxX:2150,alive:true},
    {x:2320,y:304,w:32,h:36,vx:-1.2,dir:-1,minX:2200,maxX:2400,alive:true},
  ];
}

function loop(){
  update();
  draw();
  if(!game.dead && !game.won) raf = requestAnimationFrame(loop);
  else showEnd();
}

function update(){
  const f = game.fox;
  const speed = 3.8;
  const jumpPower = -10.5;
  const gravity = 0.55;

  // Move
  if(keys['ArrowLeft']||keys['KeyA'])  { f.vx = -speed; f.facing=-1; }
  else if(keys['ArrowRight']||keys['KeyD']){ f.vx = speed; f.facing=1; }
  else f.vx *= 0.75;

  if((keys['Space']||keys['ArrowUp']||keys['KeyW']) && f.onGround){
    f.vy = jumpPower;
    f.onGround = false;
    spawnParticles(f.x+f.w/2, f.y+f.h, '#00c896', 6);
  }

  f.vy += gravity;
  if(f.vy > 16) f.vy = 16;
  f.x += f.vx;
  f.y += f.vy;
  f.x = Math.max(0, f.x);
  f.onGround = false;

  // Platform collision
  for(const p of game.platforms){
    if(f.x+f.w > p.x && f.x < p.x+p.w){
      if(f.y+f.h > p.y && f.y+f.h < p.y+p.h+16 && f.vy >= 0){
        f.y = p.y - f.h;
        f.vy = 0;
        f.onGround = true;
      }
    }
  }
  // Fall death
  if(f.y > H+60){ loseLife(); return; }

  // Camera
  game.cam = Math.max(0, f.x - W*0.35);

  // Coins
  for(const c of game.coins){
    if(!c.collected && Math.abs(f.x+f.w/2 - c.x)<22 && Math.abs(f.y+f.h/2 - c.y)<22){
      c.collected=true; game.score+=10;
      spawnParticles(c.x, c.y, '#ffd84d', 8);
      updateHUD();
    }
    c.anim += 0.06;
  }

  // Enemies
  for(const e of game.enemies){
    if(!e.alive) continue;
    e.x += e.vx;
    if(e.x < e.minX || e.x+e.w > e.maxX){ e.vx*=-1; e.dir*=-1; }

    // Stomp enemy
    if(f.x+f.w-6 > e.x && f.x+6 < e.x+e.w &&
       f.y+f.h > e.y && f.y+f.h < e.y+e.h+12 && f.vy > 0){
      e.alive=false; f.vy=-7;
      game.score+=25; updateHUD();
      spawnParticles(e.x+e.w/2, e.y, '#ff4d6d', 10);
    } else if(f.x+f.w-4>e.x && f.x+4<e.x+e.w && f.y+f.h-4>e.y && f.y+4<e.y+e.h){
      loseLife(); return;
    }
  }

  // Particles
  game.particles = game.particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life--;
    return p.life>0;
  });

  // Flag
  const fl = game.flag;
  if(f.x+f.w > fl.x && f.x < fl.x+24 && f.y+f.h > fl.y){
    game.won=true;
    game.score += game.lives*50;
    updateHUD();
  }

  // Animate fox
  f.frameT++;
  if(Math.abs(f.vx)>0.5 && f.onGround && f.frameT%8===0) f.frame=(f.frame+1)%2;
  if(!f.onGround) f.frame=2;
}

function loseLife(){
  game.lives--;
  updateHUD();
  if(game.lives<=0){ game.dead=true; return; }
  const f = game.fox;
  f.x=100; f.y=200; f.vx=0; f.vy=0; game.cam=0;
  raf = requestAnimationFrame(loop);
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const spd = 2+Math.random()*4;
    game.particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,color,life:20+Math.random()*15});
  }
}

function draw(){
  // Sky
  ctx.fillStyle='#0d2347';
  ctx.fillRect(0,0,W,H);

  // Clouds
  ctx.fillStyle='rgba(255,255,255,0.06)';
  [[200,60,80,30],[500,40,100,35],[350,90,60,22],[650,70,90,28]].forEach(([x,y,w,h])=>{
    const cx = ((x - game.cam*0.3)%W+W)%W;
    roundRect(cx,y,w,h,15);
  });

  ctx.save();
  ctx.translate(-game.cam, 0);

  // Platforms
  for(const p of game.platforms){
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(p.x,p.y,p.w,4);
    // Grass top
    if(p.h>20){
      ctx.fillStyle='#3a9e4a';
      ctx.fillRect(p.x,p.y,p.w,8);
    }
  }

  // Coins
  for(const c of game.coins){
    if(c.collected) continue;
    const bob = Math.sin(c.anim)*4;
    ctx.save();
    ctx.translate(c.x, c.y+bob);
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fillStyle='#ffd84d';
    ctx.fill();
    ctx.strokeStyle='#c9a200';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(-3,-3,3,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Enemies (slimes)
  for(const e of game.enemies){
    if(!e.alive) continue;
    ctx.save();
    ctx.translate(e.x+e.w/2, e.y+e.h/2);
    if(e.dir < 0) ctx.scale(-1,1);
    // Body
    ctx.fillStyle='#ff4d6d';
    ctx.beginPath();
    ctx.ellipse(0, 4, 16, 14, 0, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle='white';
    ctx.beginPath(); ctx.arc(-6,-2,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-2,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a1628';
    ctx.beginPath(); ctx.arc(-5,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Flag
  const fl = game.flag;
  ctx.fillStyle='#888';
  ctx.fillRect(fl.x+11, fl.y-60, 3, 80);
  ctx.fillStyle='#00c896';
  ctx.beginPath();
  ctx.moveTo(fl.x+14,fl.y-60);
  ctx.lineTo(fl.x+40,fl.y-48);
  ctx.lineTo(fl.x+14,fl.y-36);
  ctx.fill();

  // Fox
  const f = game.fox;
  ctx.save();
  ctx.translate(f.x+f.w/2, f.y+f.h/2);
  if(f.facing<0) ctx.scale(-1,1);

  // Body
  ctx.fillStyle='#ff8c42';
  ctx.beginPath();
  ctx.ellipse(0, 5, 16, 15, 0, 0, Math.PI*2);
  ctx.fill();

  // Belly
  ctx.fillStyle='#ffcf9e';
  ctx.beginPath();
  ctx.ellipse(0, 8, 9, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // Head
  ctx.fillStyle='#ff8c42';
  ctx.beginPath();
  ctx.ellipse(2, -8, 13, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // Ears
  ctx.fillStyle='#ff6b00';
  ctx.beginPath();
  ctx.moveTo(-6,-14); ctx.lineTo(-12,-22); ctx.lineTo(0,-14); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(8,-14); ctx.lineTo(14,-22); ctx.lineTo(4,-14); ctx.fill();
  ctx.fillStyle='#ffb5a0';
  ctx.beginPath();
  ctx.moveTo(-5,-15); ctx.lineTo(-10,-20); ctx.lineTo(0,-15); ctx.fill();

  // Eyes
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(-4,-9,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-9,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath(); ctx.arc(-3,-9,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9,-9,2,0,Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle='#ff4488';
  ctx.beginPath(); ctx.arc(13,-6,2.5,0,Math.PI*2); ctx.fill();

  // Tail (bob when moving)
  const tailWag = Math.sin(Date.now()*0.008)*0.3;
  ctx.fillStyle='#ff8c42';
  ctx.beginPath();
  ctx.moveTo(-12,8);
  ctx.quadraticCurveTo(-28+Math.cos(tailWag)*8, 2+Math.sin(tailWag)*8, -22,-4);
  ctx.lineWidth=10; ctx.strokeStyle='#ff8c42'; ctx.stroke();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(-22+Math.cos(tailWag)*3,-4+Math.sin(tailWag)*3,6,0,Math.PI*2); ctx.fill();

  // Legs animation
  const legAnim = f.onGround ? Math.sin(Date.now()*0.015)*10 : 0;
  ctx.fillStyle='#ff6b00';
  ctx.fillRect(-10+legAnim*0.5, 14, 8, 10);
  ctx.fillRect(4-legAnim*0.5, 14, 8, 10);
  ctx.restore();

  // Particles
  for(const p of game.particles){
    ctx.globalAlpha = p.life/35;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.restore(); // end cam translation

  // HUD score floating
  ctx.fillStyle='rgba(0,0,0,0.4)';
  roundRect(12,12,160,32,8);
  ctx.fillStyle='#ffd84d';
  ctx.font='bold 14px Nunito';
  ctx.fillText(`⭐ ${game.score} pts`, 22, 33);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function updateHUD(){
  document.getElementById('score').textContent = game.score;
  document.getElementById('lives').textContent = '🦊'.repeat(Math.max(0,game.lives));
}

function showEnd(){
  const ov = document.getElementById('overlay');
  ov.innerHTML = game.won
    ? `<h2>🎉 Você Venceu!</h2>
       <div class="score-big">${game.score}</div>
       <p>Pontos! A raposa chegou à bandeira!</p>
       <button class="btn" onclick="startGame()">Jogar de Novo</button>
       <a href="../index.html" class="btn" style="background:rgba(255,255,255,0.1);color:var(--white);text-decoration:none;margin-top:4px">← Voltar ao Hub</a>`
    : `<h2>💀 Game Over</h2>
       <p>Tente de novo! Use as setas pra mover e ESPAÇO pra pular!</p>
       <button class="btn" onclick="startGame()">Tentar de Novo</button>
       <a href="../index.html" class="btn" style="background:rgba(255,255,255,0.1);color:var(--white);text-decoration:none;margin-top:4px">← Voltar ao Hub</a>`;
  ov.style.display='flex';
}
</script>
</body>
</html>
