<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobra do Teclado — Info Kid</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1628;--green:#00c896;--yellow:#ffd84d;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--navy);font-family:'Nunito',sans-serif;color:#f0f4ff;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.07);}
  .back{text-decoration:none;color:var(--green);font-weight:800;}
  .htitle{font-family:'Fredoka One';font-size:1.3rem;color:var(--yellow);}
  #score-disp{font-weight:800;color:var(--yellow);}
  canvas{border-radius:12px;border:2px solid rgba(0,200,150,0.3);margin:16px 0;display:block;}
  .keys-guide{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .key{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-bottom:3px solid rgba(255,255,255,0.3);border-radius:8px;
    padding:5px 12px;font-size:0.8rem;font-weight:800;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;
    background:rgba(10,22,40,0.9);border-radius:12px;text-align:center;padding:24px;}
  #overlay h2{font-family:'Fredoka One';font-size:2rem;color:var(--green);}
  .score-big{font-family:'Fredoka One';font-size:3rem;color:var(--yellow);}
  .btn{background:var(--green);color:#0a1628;font-family:'Fredoka One';font-size:1.1rem;
    border:none;padding:12px 32px;border-radius:40px;cursor:pointer;}
  .btn:hover{opacity:0.9;}
  .wrap{position:relative;}
  .difficulty{display:flex;gap:8px;margin:8px 0;}
  .diff-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;padding:6px 16px;cursor:pointer;font-size:0.8rem;font-weight:800;color:#f0f4ff;}
  .diff-btn.active{background:var(--green);color:#0a1628;border-color:var(--green);}
  .mobile-ctrl{display:none;gap:6px;flex-direction:column;align-items:center;margin:8px 0;}
  .ctrl-row{display:flex;gap:6px;}
  .mbtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;width:50px;height:50px;font-size:1.3rem;cursor:pointer;
    color:white;display:flex;align-items:center;justify-content:center;user-select:none;}
  @media(max-width:500px){.mobile-ctrl{display:flex;} canvas{width:300px;height:300px;}}
</style>
</head>
<body>
<header>
  <a href="../index.html" class="back">← Voltar</a>
  <span class="htitle">🐍 Cobra do Teclado</span>
  <div>Pontos: <span id="score-disp">0</span></div>
</header>

<div style="display:flex;gap:8px;margin:12px 0;align-items:center;font-size:0.85rem;color:rgba(240,244,255,0.6);">
  Dificuldade:
</div>
<div class="difficulty">
  <button class="diff-btn active" onclick="setDiff(150,'Fácil',this)">🟢 Fácil</button>
  <button class="diff-btn" onclick="setDiff(100,'Normal',this)">🟡 Normal</button>
  <button class="diff-btn" onclick="setDiff(65,'Difícil',this)">🔴 Difícil</button>
</div>

<div class="wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>🐍 Cobra do Teclado</h2>
    <p style="color:rgba(240,244,255,0.7)">Use as <strong>setas ← ↑ → ↓</strong> para guiar a cobra.<br>
    Coma as maçãs e cresça — sem bater nas paredes ou em si mesma!</p>
    <button class="btn" onclick="startGame()">Jogar!</button>
  </div>
</div>

<div class="keys-guide">
  <span class="key">↑ Cima</span><span class="key">← Esq</span>
  <span class="key">↓ Baixo</span><span class="key">→ Dir</span>
</div>

<div class="mobile-ctrl">
  <div class="ctrl-row"><button class="mbtn" onclick="setDir(0,-1)">▲</button></div>
  <div class="ctrl-row">
    <button class="mbtn" onclick="setDir(-1,0)">◀</button>
    <button class="mbtn" onclick="setDir(0,1)">▼</button>
    <button class="mbtn" onclick="setDir(1,0)">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRID = 20, COLS = 20, ROWS = 20;
let snake, dir, nextDir, food, score, interval, speed = 150;
let particles = [];

function setDiff(s, label, btn){
  speed = s;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

document.addEventListener('keydown', e=>{
  const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(map[e.code]){
    e.preventDefault();
    const [nx,ny] = map[e.code];
    if(nx !== -dir[0] || ny !== -dir[1]) nextDir = [nx,ny];
  }
});

function setDir(x,y){
  if(x !== -dir[0] || y !== -dir[1]) nextDir = [x,y];
}

function rndFood(){
  let pos;
  do { pos = [Math.floor(Math.random()*COLS), Math.floor(Math.random()*ROWS)]; }
  while(snake.some(s=>s[0]===pos[0]&&s[1]===pos[1]));
  return pos;
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  snake = [[10,10],[9,10],[8,10]];
  dir = [1,0]; nextDir = [1,0];
  food = rndFood(); score = 0; particles=[];
  document.getElementById('score-disp').textContent = 0;
  if(interval) clearInterval(interval);
  interval = setInterval(step, speed);
}

function step(){
  dir = nextDir;
  const head = [snake[0][0]+dir[0], snake[0][1]+dir[1]];
  // Wall collision
  if(head[0]<0||head[0]>=COLS||head[1]<0||head[1]>=ROWS){ gameOver(); return; }
  // Self collision
  if(snake.some(s=>s[0]===head[0]&&s[1]===head[1])){ gameOver(); return; }

  snake.unshift(head);
  if(head[0]===food[0]&&head[1]===food[1]){
    score += 10;
    spawnParticles(food[0]*GRID+GRID/2, food[1]*GRID+GRID/2);
    food = rndFood();
    document.getElementById('score-disp').textContent = score;
  } else snake.pop();

  draw();
}

function spawnParticles(x,y){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:20,color:'#ff4d6d'});
  }
}

function draw(){
  // Background grid
  ctx.fillStyle='#0d2040';
  ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  for(let i=0;i<=COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*GRID,0); ctx.lineTo(i*GRID,400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*GRID); ctx.lineTo(400,i*GRID); ctx.stroke();
  }

  // Snake
  snake.forEach(([x,y],i)=>{
    const ratio = i/snake.length;
    const g = Math.floor(200*(1-ratio)+100*ratio);
    ctx.fillStyle = i===0 ? '#00e8a8' : `rgb(0,${g},100)`;
    ctx.beginPath();
    ctx.roundRect(x*GRID+1,y*GRID+1,GRID-2,GRID-2,i===0?6:4);
    ctx.fill();
    if(i===0){
      // Eyes
      const [ex,ey] = dir;
      ctx.fillStyle='white';
      const ox=ey*5, oy=ex*5;
      ctx.beginPath(); ctx.arc(x*GRID+GRID/2+ox-2,y*GRID+GRID/2+oy-2,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x*GRID+GRID/2+ox+4,y*GRID+GRID/2+oy+4,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0a1628';
      ctx.beginPath(); ctx.arc(x*GRID+GRID/2+ox-1,y*GRID+GRID/2+oy-1,1.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x*GRID+GRID/2+ox+5,y*GRID+GRID/2+oy+5,1.5,0,Math.PI*2); ctx.fill();
    }
  });

  // Food (apple)
  const [fx,fy] = food;
  const t = Date.now()*0.004;
  ctx.save();
  ctx.translate(fx*GRID+GRID/2, fy*GRID+GRID/2+Math.sin(t)*2);
  ctx.fillStyle='#ff4d6d';
  ctx.beginPath();
  ctx.arc(0, 2, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#5a3200';
  ctx.fillRect(-1,-8,2,6);
  ctx.fillStyle='#3a9e4a';
  ctx.beginPath();
  ctx.ellipse(4,-5,6,3,-0.4,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Particles
  particles = particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life--;
    ctx.globalAlpha=p.life/20;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
    return p.life>0;
  });
  ctx.globalAlpha=1;

  // Score
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(8,8,110,28,8); ctx.fill();
  ctx.fillStyle='#ffd84d';
  ctx.font='bold 14px Nunito';
  ctx.fillText(`⭐ ${score} pts`, 18, 27);
}

function gameOver(){
  clearInterval(interval);
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h2>💀 Game Over!</h2>
    <div class="score-big">${score}</div>
    <p style="color:rgba(240,244,255,0.7)">Pontos! Continue praticando!</p>
    <button class="btn" onclick="startGame()">Jogar de Novo</button>
    <a href="../index.html" class="btn" style="background:rgba(255,255,255,0.1);color:#f0f4ff;text-decoration:none;margin-top:4px">← Voltar</a>`;
  ov.style.display='flex';
}
</script>
</body>
</html>
